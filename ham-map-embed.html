<!doctype html>
<html lang="en" data-theme="forest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="description" content="Embedded version of the SP3FCK ham radio map.">
  <title>SP3FCK | Ham Map Embed</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/ham-map.css?v=20261026c">
  <script>(function(){var t=localStorage.getItem('sp3fck-theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body class="embed-mode">
  <div class="noise"></div>

  <main class="wrap map-layout">
    <section class="panel filter-panel">
      <h2>Main filters</h2>
      <div class="filter-grid">
        <div>
          <label for="dateFrom">Date from</label>
          <input id="dateFrom" type="date">
        </div>

        <div>
          <label for="dateTo">Date to</label>
          <input id="dateTo" type="date">
        </div>

        <div>
          <label for="bandFilter">Band</label>
          <select id="bandFilter">
            <option value="all">All</option>
          </select>
        </div>

        <div>
          <label for="dxccFilter">Country (DXCC)</label>
          <select id="dxccFilter">
            <option value="all">All</option>
          </select>
        </div>

        <div>
          <label for="continentFilter">Continent</label>
          <select id="continentFilter">
            <option value="all">All</option>
          </select>
        </div>

        <div>
          <label for="cqFilter">CQ zone</label>
          <select id="cqFilter">
            <option value="all">All</option>
          </select>
        </div>

        <div>
          <label for="ituFilter">ITU zone</label>
          <select id="ituFilter">
            <option value="all">All</option>
          </select>
        </div>

        <div class="actions">
          <label class="chip" title="Hide VHF/UHF bands (6m, 2m, 70cm and up)"><input id="hfOnlyFilter" type="checkbox"> HF only (160m-10m)</label>
          <button id="applyFilters" class="btn">Apply filters</button>
          <button id="clearFilters" class="btn ghost">Reset</button>
          <button id="refreshData" class="btn ghost">Refresh data</button>
        </div>
      </div>

      <p class="hint">Data is refreshed by GitHub Actions every hour. This button fetches the latest JSON file.</p>
      <div id="status" class="status">Loading data...</div>
    </section>

    <section class="map-panel">
      <div class="map-toolbar">
        <div class="segmented" role="group" aria-label="Map projection">
          <button type="button" data-projection="globe" class="active">Globe</button>
          <button type="button" data-projection="azimuthal">Azimuthal</button>
          <button type="button" data-projection="flat">Flat</button>
        </div>
        <div class="layer-toggles" role="group" aria-label="Map layers">
          <label class="chip"><input type="checkbox" data-layer="cq"> CQ zones</label>
          <label class="chip"><input type="checkbox" data-layer="itu"> ITU zones</label>
          <label class="chip"><input type="checkbox" data-layer="night"> Grayline</label>
        </div>
        <button type="button" id="resetView" class="btn ghost small">Reset view</button>
      </div>
      <div id="map" class="globe-map" aria-label="Contacts map">
        <div id="mapTooltip" class="map-tooltip" hidden></div>
        <div id="mapLegend" class="map-legend"></div>
      </div>
    </section>

    <section class="panel stats-panel">
      <h2>Statistics</h2>
      <div class="stats-grid">
        <article class="stat-card">
          <p class="stat-label">QSO</p>
          <p class="stat-value" id="statQso">0</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">DXCC worked</p>
          <p class="stat-value" id="statDxcc">0</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">WAZ (CQ zones)</p>
          <p class="stat-value" id="statWaz">0</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">Top band</p>
          <p class="stat-value" id="statTopBand">-</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">Top mode</p>
          <p class="stat-value" id="statTopMode">-</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">ITU zones</p>
          <p class="stat-value" id="statItu">0</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">Continents (WAC)</p>
          <p class="stat-value" id="statCont">0</p>
        </article>
        <article class="stat-card">
          <p class="stat-label">Last update</p>
          <p class="stat-value" id="statUpdated">-</p>
        </article>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <script src="data/dxcc-entities.js?v=20261026c"></script>
  <script src="data/cq-zones.js?v=20261026c"></script>
  <script src="data/itu-zones.js?v=20261026c"></script>
  <script src="data/qso.latest.js"></script>
  <script src="assets/js/ham-map.js?v=20261026c" defer></script>
</body>
</html>
